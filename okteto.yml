build:
  dev:
    context: .
    target: dev

deploy:
  compose: docker-compose.yaml

dev:
  docs:
    image: ${OKTETO_BUILD_DEV_IMAGE}
    sync:
      - .:/app
    workdir: /app
    command: "yarn start"
    forward:
      - 8080:8080

test:
  # Opens pages of the three sites of the deployed image in Chrome (see
  # scripts/smoke-test). Keep the image tag equal to the playwright version
  # of scripts/smoke-test/package.json.
  smoke:
    image: mcr.microsoft.com/playwright:v1.65.1-noble
    context: scripts/smoke-test
    caches:
      - /root/.npm
    commands:
      - npm install --no-audit --no-fund
      - node smoke-test.mjs
